<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="auth-helper.js"></script>
  <script>
    (async function () {
      try {
        var auth = await AuthHelper.ensureSession();
        if (!auth) location.replace('login1.html');
      } catch (e) {
        location.replace('login1.html');
      }
    })();
  </script>
  <title>社区留言 · Study Plan</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="min-h-screen bg-gradient-to-br from-violet-50 via-white to-indigo-50 font-sans text-slate-800 antialiased">
  <main class="relative mx-auto max-w-3xl px-4 py-8 sm:px-6">
    <header class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="mb-1 text-sm font-medium uppercase tracking-wider text-violet-600">Community</p>
        <h1 class="font-display text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
          <i class="fa-solid fa-comments mr-2 text-violet-600"></i>社区留言
        </h1>
        <p class="mt-2 text-sm text-slate-600">全员留言与打卡状态；选择日期查看当日留言。</p>
      </div>
      <span id="userChip" class="rounded-lg border border-white/80 bg-white/90 px-3 py-1.5 text-xs font-medium text-slate-600"></span>
    </header>

    <section class="glass-panel mb-6 rounded-2xl border border-white/70 bg-white/90 p-4 shadow-lg sm:p-5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2">
          <button id="calPrev" type="button" class="flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chevron-left text-xs"></i></button>
          <span id="calTitle" class="min-w-[120px] text-center text-sm font-semibold text-slate-800"></span>
          <button id="calNext" type="button" class="flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50"><i class="fa-solid fa-chevron-right text-xs"></i></button>
          <button id="calToday" type="button" class="rounded-lg border border-violet-200 bg-violet-50 px-2.5 py-1 text-xs font-medium text-violet-800 hover:bg-violet-100">今天</button>
        </div>
        <button id="btnCommunityCalRefresh" type="button" class="text-xs font-medium text-brand-600 hover:underline">刷新打卡状态</button>
      </div>
      <p class="mt-2 text-[10px] text-slate-500">绿=已打卡 · 黄=进行中 · 灰=未打卡（任务+习惯汇总）</p>
      <div class="mt-3 grid grid-cols-7 gap-1 text-center text-[10px] font-medium text-slate-500"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
      <div id="calendarGrid" class="mt-1 grid grid-cols-7 gap-1"></div>
      <p id="selectedDateHint" class="mt-3 text-xs text-slate-600"></p>
    </section>

    <section class="glass-panel rounded-2xl border border-violet-200/80 bg-violet-50/30 p-4 shadow-lg sm:p-5">
      <div class="mb-2 flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-sm font-semibold text-violet-900"><i class="fa-solid fa-message mr-1"></i>留言</h2>
          <p id="communityMsgFilterHint" class="mt-0.5 text-[10px] text-violet-800/80"></p>
        </div>
        <button id="btnCommunityMsgRefresh" type="button" class="text-xs font-medium text-violet-700 hover:underline">刷新</button>
      </div>
      <div id="communityMsgScroll" class="hidden max-h-80 min-h-[10rem] flex-col gap-2 overflow-y-auto rounded-xl border border-slate-200/80 bg-slate-100/90 p-2"></div>
      <p id="communityMsgEmpty" class="py-10 text-center text-xs text-slate-500">暂无留言</p>
      <div class="mt-3 flex flex-col gap-2 sm:flex-row sm:items-end">
        <textarea id="communityMsgInput" rows="3" maxlength="2000" class="min-h-0 flex-1 rounded-lg border border-violet-200 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-violet-100"></textarea>
        <button id="btnCommunityMsgSend" type="button" class="shrink-0 rounded-lg bg-violet-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-violet-700">发送</button>
      </div>
    </section>
  </main>

  <script src="app-config.js"></script>
  <script src="js/plan-supabase.js"></script>
  <script src="js/app-nav.js"></script>
  <script src="js/community-page.js"></script>
</body>
</html>
